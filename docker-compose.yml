services:
  api:
    build: .
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - api/.env
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  mcp:
    image: self-sensored-api
    pull_policy: never
    depends_on:
      - api
    command: ["self-sensored-mcp"]
    ports:
      - "0.0.0.0:7446:7446"
    env_file:
      - mcp/.env
    environment:
      MCP_TRANSPORT: http
      MCP_HTTP_BIND: "0.0.0.0:7446"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
