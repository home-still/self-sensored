name: SelfSensored
options:
  bundleIdPrefix: com.ladvien
  deploymentTarget:
    iOS: "17.0"
  generateEmptyDirectories: true

targets:
  SelfSensored:
    type: application
    platform: iOS
    sources:
      - path: SelfSensored
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ladvien.selfsensored
        DEVELOPMENT_TEAM: KANRAMGCUY
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_ASSET_PATHS: ""
        SWIFT_STRICT_CONCURRENCY: complete
      configs:
        debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        release:
          SWIFT_OPTIMIZATION_LEVEL: -O
    info:
      path: SelfSensored/Info.plist
      properties:
        CFBundleDisplayName: Self Sensored
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSHealthShareUsageDescription: >-
          Self Sensored reads your health data to sync it to your personal dashboard.
        NSHealthUpdateUsageDescription: >-
          Self Sensored writes the meals you voice-log back to Apple Health so all 38 nutrients live alongside your other health data.
        NSMicrophoneUsageDescription: >-
          Self Sensored uses the microphone so you can describe meals by voice.
        NSSpeechRecognitionUsageDescription: >-
          Self Sensored transcribes your meal descriptions on-device using Apple's Speech framework.
        NSLocationWhenInUseUsageDescription: >-
          Self Sensored records your location at sync time to associate health data with where you are.
        NSLocalNetworkUsageDescription: >-
          Self Sensored connects to your local API server to sync health data.
        NSBonjourServices:
          - _http._tcp
        NSAppTransportSecurity:
          # NSAllowsLocalNetworking covers the only non-HTTPS case we care
          # about (local dev server on the LAN). Dropping the blanket
          # NSAllowsArbitraryLoads keeps ATS active for everything else.
          NSAllowsLocalNetworking: true
        UIBackgroundModes:
          - fetch
    entitlements:
      path: SelfSensored/SelfSensored.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.background-delivery: true

  SelfSensoredTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SelfSensoredTests
    dependencies:
      - target: SelfSensored
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ladvien.selfsensored.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  SelfSensored:
    build:
      targets:
        SelfSensored: all
        SelfSensoredTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SelfSensoredTests
    profile:
      config: Release
    analyze:
      config: Debug
