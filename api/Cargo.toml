[package]
name = "self-sensored-api"
version = "0.1.0"
edition = "2024"

[dependencies]
# Web framework
axum = { version = "0.8", features = ["macros"] }
# Narrowed from "full" — we only need the multi-thread runtime, async I/O, and
# the usual macro + signal helpers. Keeps the binary smaller and the attack
# surface tighter.
tokio = { version = "1", default-features = false, features = [
    "rt-multi-thread",
    "net",
    "macros",
    "signal",
    "time",
    "io-util",
    "sync",
] }
tower-http = { version = "0.6", features = ["catch-panic", "request-id", "trace", "util"] }

# Database
sqlx = { version = "0.8", features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "chrono",
    "uuid",
    "json",
] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Types
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
uuid = { version = "1", features = ["v4", "serde"] }

# Auth
jsonwebtoken = "9"

# Typed errors
thiserror = "2"

# Config
dotenvy = "0.15"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.17", default-features = false }

# Password hashing
argon2 = "0.5"

# Input validation
validator = { version = "0.18", features = ["derive"] }
once_cell = "1"

# Hashing
sha2 = "0.10"

# USDA importer + LLM client
csv = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
async-trait = "0.1"
futures-util = "0.3"
moka = { version = "0.12", features = ["future"] }

[dev-dependencies]
wiremock = "0.6"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
