[package]
name = "self-sensored-mcp"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "self-sensored-mcp"
path = "src/main.rs"

[dependencies]
rmcp = { version = "1.4", features = ["server", "macros", "schemars", "transport-io", "transport-streamable-http-server"] }

axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tower = { version = "0.5", default-features = false }
tokio-util = { version = "0.7", default-features = false, features = ["rt"] }

tokio = { version = "1", default-features = false, features = [
    "rt-multi-thread",
    "macros",
    "signal",
    "time",
    "io-util",
    "net",
    "sync",
] }

sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "chrono",
    "uuid",
    "json",
    "bigdecimal",
] }

sqlparser = { version = "0.61", features = ["visitor"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = { version = "1", features = ["chrono04"] }

anyhow = "1"
thiserror = "2"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

dotenvy = "0.15"

uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
bigdecimal = "0.4"
